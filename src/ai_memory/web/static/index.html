<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ai-memory Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>ai-memory Dashboard</h1>
    <div class="tabs">
        <button class="tab-button active" data-tab="memories">Memories</button>
        <button class="tab-button" data-tab="review">Review</button>
        <button class="tab-button" data-tab="stats">Stats</button>
        <button class="tab-button" data-tab="sources">Sources</button>
    </div>
    <div id="app">
        <div class="tab-content active" id="tab-memories">
            <div class="filters">
                <select id="filter-status" multiple size="3">
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="auto_approved">Auto Approved</option>
                    <option value="rejected">Rejected</option>
                    <option value="expired">Expired</option>
                </select>
                <input type="text" id="search-input" placeholder="Search memories...">
                <button id="refresh-btn">Refresh</button>
            </div>
            <div id="memories-container">
                <p>Loading...</p>
            </div>
        </div>
        <div class="tab-content" id="tab-review">
            <h2>Review Queue</h2>
            <button id="refresh-review-btn">Refresh</button>
            <div id="review-list"></div>
        </div>
        <div class="tab-content" id="tab-stats">
            <h2>Statistics</h2>
            <div class="stat-card">
                <h3>Total Memories</h3>
                <p id="stat-total">-</p>
            </div>
            <div class="charts">
                <div>
                    <h4>By Status</h4>
                    <div id="chart-status"></div>
                </div>
                <div>
                    <h4>By Type</h4>
                    <div id="chart-type"></div>
                </div>
                <div>
                    <h4>By Scope</h4>
                    <div id="chart-scope"></div>
                </div>
            </div>
        </div>
        <div class="tab-content" id="tab-sources" style="display:none">
            <h2>Source Explorer</h2>
            <div id="sources-list"></div>
            <div id="source-preview-container" style="display:none">
                <h3>Preview</h3>
                <pre id="source-preview"></pre>
            </div>
        </div>
    </div>
    <div id="editor-modal" class="modal" style="display:none">
        <div class="modal-content">
            <span class="close" onclick="closeEditor()">&times;</span>
            <h3>Edit Memory</h3>
            <input type="hidden" id="edit-id">
            <p id="edit-uri" class="edit-uri"></p>
            <textarea id="edit-content" rows="10" style="width:100%"></textarea>
            <div class="modal-actions">
                <button onclick="saveMemory()">Save</button>
                <button onclick="closeEditor()">Cancel</button>
            </div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
